name: Deploy to GitHub Pages

# dist 폴더를 그대로 GitHub Pages에 올린다.
# 빌드 도구가 없으므로 파일을 옮기기만 하면 끝난다.
# 포크해 간 저장소에서도 Settings > Pages > Source 를 "GitHub Actions"로 두면 그대로 동작한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
